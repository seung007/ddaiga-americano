# 가이드 글 자동 게시 (2026-11-11)
#
# 왜: 주간 글 초안(비공개 저장소 ddaiga-pipeline editorial/DRAFT.md)이 검증을 「통과」로 끝내도 PR 에서 멈춰,
#     사람이 합칠 때까지 글이 안 나갔다. hyun 님 결정(2026-11-11): 이중 검사를 통과한 글은 사람 승인 없이 게시한다.
#
# 무엇을 합치나 — 아래를 전부 만족할 때만
#   ① 라벨 auto-publish — 초안 작업이 검증 결과 「통과」(지움 한도 안 · 사람 확인 0 · 위험 표현 0)일 때만 붙인다.
#      「사람 확인 필요」 「보류」는 이 라벨을 붙이지 않는다 → 지금처럼 사람이 본다
#   ② 브랜치 draft/<slug> · 이 저장소 안에서 연 PR (포크 PR 은 안 된다)
#   ③ 바뀐 파일이 글 내용 파일 1개(lib/guide/content/<slug>.json)와 글 원장(lib/guide/articles.ts)뿐
#   ④ npm run check 통과 (출처·인용·숫자 검사)
# 하나라도 어기면 합치지 않고 실패로 남는다 — 사람이 PR 을 보면 된다.
name: auto-publish-guide

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-publish-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'auto-publish') &&
      startsWith(github.head_ref, 'draft/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: 글 파일만 바뀌었는지
        run: |
          files=$(gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate --jq '.[].filename')
          echo "$files"
          bad=$(printf '%s\n' "$files" | grep -v -E '^lib/guide/content/[a-z0-9-]+\.json$|^lib/guide/articles\.ts$' || true)
          if [ -n "$bad" ]; then echo "::error title=글 밖 변경::$bad"; exit 1; fi
          n=$(printf '%s\n' "$files" | grep -c '^lib/guide/content/' || true)
          if [ "$n" -ne 1 ]; then echo "::error title=글 파일 수::글 내용 파일이 1개여야 합니다 ($n)"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: 합치기
        run: |
          gh api -X PUT "repos/${{ github.repository }}/pulls/$PR/merge" -f merge_method=squash -f sha="$HEAD_SHA" \
            -f commit_title="$(gh api repos/${{ github.repository }}/pulls/$PR --jq .title) (#$PR, 자동 게시)"
          echo "::notice title=게시::PR #$PR 합침 — Vercel 이 main 을 배포한다"
