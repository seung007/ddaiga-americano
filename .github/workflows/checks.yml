# 검사기 자동 실행
#
# 왜 만들었나 (2026-09-06)
# ───────────────────────
# 두 가지를 동시에 푼다.
#
# 1) **사람이 기억해야 하는 규칙을 없앤다.** AGENTS.md에 "출처를 건드렸으면
#    커밋 전에 검사기를 돌려라"고 적혀 있는데, 문서에 적는 것으로는 안 지켜졌다
#    (제목 실험 때 "2주간 사이트를 바꾸지 마세요"를 적어놓고 계속 바꿨다).
#    여기서는 푸시하면 무조건 돈다.
#
# 2) **내가 못 하는 네트워크 검증을 대신 한다.** 에이전트 샌드박스는 외부
#    사이트를 프록시에서 막는다 — `check:images` 51장이 전부 `fetch failed`였고
#    Scrapling도 `curl (7) CONNECT tunnel failed 403`으로 막혔다.
#    GitHub Actions 러너에는 네트워크가 있으므로 **여기가 유일하게 진짜로
#    확인되는 자리**다. 인용 논문·유튜브·구매 링크·신발 사진이 실제로 살아 있는지
#    매주 여기서 확인한다.
#
# 토큰 관점: 이 워크플로는 **모델을 전혀 쓰지 않는다.** 스크립트가 판정하고
# 실패할 때만 사람에게 알림이 간다. 자동화의 기본은 "모델을 루프에서 빼는 것"이다.

name: checks

on:
  push:
    branches: [main]
  pull_request:
  # 매주 월요일 09:00 KST (= 일요일 00:00 UTC).
  # 링크와 사진은 우리가 안 건드려도 상대방이 없앨 수 있다 —
  # 이번 주에 실제로 브랜드 공식몰 3곳이 죽어 링크 14개가 함께 죽어 있었다.
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  offline:
    name: 오프라인 검사 (타입·인용·신발·그림·링크구성·사진출처)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  network:
    name: 네트워크 검사 (실제 조회)
    runs-on: ubuntu-latest
    # 푸시마다 남의 서버를 두드리면 민폐다. 주간 실행과 수동 실행에서만 돈다.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:all

  # ── 대회 일정 자동 정리 ─────────────────────────────────────
  #
  # 2026-09-12 신설. 사용자 요청: "대회 일정 허브는 자동화 루프 만들어 놓으면 돼."
  #
  # **빼는 쪽만 자동이다.** 대회 날짜가 지나면 목록에서 빠지고 보관 파일로 옮겨진다.
  # 시간이 지나면 확실히 참이 되는 판정이라 사람 확인이 필요 없다.
  #
  # **넣는 쪽은 자동화하지 않는다.** 새 대회를 어디선가 긁어 와 날짜를 채우면
  # 틀린 날짜가 사람 확인 없이 배포된다. 이 저장소는 그걸로 이미 당했다 —
  # 지어낸 좌표가 숫자 검사를 전부 통과하고 배포돼 경로선이 한강을 가로질렀다.
  # 대회는 더 나쁘다. 사람이 참가비를 내고 이동한다.
  #
  # 바뀐 게 있을 때만 커밋한다. 매주 빈 커밋을 쌓지 않는다.
  races-sweep:
    name: 대회 일정 정리 (지난 대회 보관)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run races:sweep -- --write
      - name: 바뀐 게 있으면 커밋
        run: |
          if [ -n "$(git status --porcelain lib/races.json lib/races.past.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add lib/races.json lib/races.past.json
            git commit -m "chore(races): 지난 대회 자동 보관"
            git push
          else
            echo "정리할 것 없음"
          fi
